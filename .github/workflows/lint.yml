name: Lint HTML

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: HTML Hint
        uses: htmlhint/action@v2  # İsmi 'htmlhint/action' olarak güncelledik
        with:
          pattern: '**/*.html'
